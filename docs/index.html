<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffeef3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="留子追番">
<link rel="icon" href="dumei.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="lulu/lulu01.jpg">
<title>留子追番</title>
<style>
  :root {
    --bg: #fff7f9; --card: #ffffff; --text: #4a2e3b; --muted: #a8899a; --line: #f6dbe4;
    --accent: #ff7ea6; --accent-2: #ffb36b; --accent-soft: #fff0f5; --chip: #fff3f7; --warn: #f08a4b;
    --shadow: 0 4px 14px rgba(255, 126, 166, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #221a20; --card: #2d2329; --text: #f6e6ee; --muted: #b293a3; --line: #43333d;
            --accent-soft: #3d2632; --chip: #36292f; --shadow: none; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; color: var(--text); background: var(--bg);
         background-image: radial-gradient(var(--line) 1.2px, transparent 1.2px); background-size: 22px 22px;
         font: 16px/1.5 -apple-system, "PingFang SC", "Hiragino Maru Gothic ProN", "Microsoft YaHei", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 12px 40px; }
  header { display: flex; align-items: center; gap: 10px; }
  header img { width: 52px; height: 52px; animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-3px) rotate(-3deg); } }
  .title { flex: 1; min-width: 0; }
  h1 { font-size: 22px; margin: 0; letter-spacing: 1px; color: var(--accent); }
  .meta { color: var(--muted); font-size: 12px; }
  .icon-btn { border: 0; background: var(--card); color: var(--text); border-radius: 999px; height: 36px; padding: 0 12px;
              font-size: 14px; box-shadow: var(--shadow); }
  .add { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
  .filters { position: sticky; top: 0; z-index: 2; margin: 10px -12px 4px; padding: 8px 12px; display: flex; gap: 8px;
             overflow-x: auto; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px); }
  .filters button { flex: none; border: 2px solid var(--line); background: var(--card); color: var(--text);
                    padding: 5px 14px; border-radius: 999px; font-size: 14px; }
  .filters button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  h2 { font-size: 14px; color: var(--muted); margin: 18px 6px 8px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  h2::before { content: "♡"; color: var(--accent); }
  h2.today { color: var(--accent); }
  h2.today::before { content: "♥"; }
  h2 .tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--accent); color: #fff; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
  li.card { position: relative; isolation: isolate; overflow: hidden; background: var(--card); border: 2px solid var(--line);
            border-radius: 22px; padding: 14px; box-shadow: var(--shadow); }
  li.card.new { border-color: var(--accent); background: linear-gradient(120deg, var(--accent-soft), var(--card) 70%); }
  /* 封面背景：图在最底层，上面盖一层从左到右渐淡的卡片色，保证字看得清 */
  li.card.has-cover { min-height: 200px; padding: 16px; display: flex; flex-direction: column; }
  .has-cover .srcs { margin-top: auto; padding-top: 12px; }
  .cover { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
  li.card.has-cover::before { content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(100deg, color-mix(in srgb, var(--card) 94%, transparent) 0%,
                                       color-mix(in srgb, var(--card) 72%, transparent) 40%,
                                       color-mix(in srgb, var(--card) 15%, transparent) 100%); }
  li.card.new.has-cover::before { background: linear-gradient(100deg, color-mix(in srgb, var(--accent-soft) 94%, transparent) 0%,
                                       color-mix(in srgb, var(--card) 72%, transparent) 40%,
                                       color-mix(in srgb, var(--card) 15%, transparent) 100%); }
  .has-cover .name { text-shadow: 0 0 6px var(--card), 0 0 2px var(--card); }
  .has-cover .note { display: inline-block; align-self: flex-start; padding: 1px 8px; border-radius: 8px;
                     background: color-mix(in srgb, var(--card) 85%, transparent); }
  .has-cover .src a, .has-cover .src .err, .has-cover .prog button, .has-cover .src .copy {
    background: color-mix(in srgb, var(--chip) 72%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .has-cover .count { padding: 0 4px; border-radius: 10px; background: color-mix(in srgb, var(--card) 80%, transparent); }
  .top { display: flex; align-items: center; gap: 8px; }
  .name { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; color: inherit; text-decoration: none;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 4px 0; }
  .time { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .badge { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 999px; background: var(--accent); color: #fff;
           margin-left: 6px; vertical-align: 2px; animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.15); } }
  .prog { flex: none; display: flex; align-items: center; gap: 4px; }
  .prog button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: var(--chip);
                 color: var(--accent); font-size: 18px; font-weight: 700; line-height: 1; }
  .prog button:active { transform: scale(.9); }
  .count { display: flex; align-items: baseline; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
  .count input { width: 50px; font: inherit; font-size: 18px; font-weight: 700; text-align: right; color: var(--text);
                 background: transparent; border: 0; border-bottom: 2px dotted var(--line); padding: 2px; border-radius: 0; }
  .count input:focus { outline: none; border-bottom-color: var(--accent); }
  .count input::-webkit-inner-spin-button, .count input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .note { font-size: 12px; color: var(--warn); margin-top: 2px; }
  .srcs { display: grid; gap: 6px; margin-top: 8px; }
  .src { display: flex; align-items: center; gap: 6px; }
  .src a, .src .err { flex: 1; min-width: 0; display: block; padding: 7px 12px; border-radius: 14px; background: var(--chip);
                      color: var(--text); text-decoration: none; font-size: 14px;
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src .lbl { display: inline-block; font-size: 11px; color: #fff; background: var(--accent); border-radius: 6px;
              padding: 0 5px; margin-right: 6px; vertical-align: 1px; }
  .src .lbl.sub { background: var(--accent-2); }
  .src .err { color: var(--warn); }
  .src .copy { flex: none; height: 34px; padding: 0 12px; border-radius: 14px; border: 2px solid var(--line);
               background: var(--card); color: var(--text); font-size: 13px; }
  .src .copy.done { color: var(--accent); border-color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; }
  .empty img { width: 96px; display: block; margin: 0 auto 8px; opacity: .9; }
  footer { margin-top: 24px; color: var(--muted); font-size: 12px; line-height: 1.8; text-align: center; }
  footer a, footer button { font-size: 12px; background: none; border: 0; color: var(--accent); padding: 0; text-decoration: none; }
  dialog { border: 0; border-radius: 22px; padding: 18px; width: min(92vw, 380px); background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(74, 46, 59, .35); }
  dialog h3 { margin: 0 0 12px; font-size: 17px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
  dialog h3 img { width: 32px; }
  dialog input, dialog select { width: 100%; font-size: 16px; padding: 10px 12px; border-radius: 14px;
                                border: 2px solid var(--line); background: var(--bg); color: var(--text); margin-bottom: 10px; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  dialog .row button { font-size: 15px; padding: 8px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--text); }
  dialog .row button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  dialog p, dialog ol { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  dialog ol { padding-left: 18px; }
  dialog a { color: var(--accent); }
  .sync-ok { color: #3fb27f; }
  .mascot { aspect-ratio: 1; object-fit: cover; border-radius: 50%; flex-shrink: 0; }
  .filters { overscroll-behavior-x: contain; }
  .catalog { margin-top: 14px; }
  .catalog .name { white-space: normal; overflow-wrap: anywhere; }
  .catalog .catalog-meta { color: var(--text); font-size: 13px; margin: 6px 0; }
  .catalog details { margin-top: auto; }
  .catalog summary { cursor: pointer; padding: 10px 0; font-size: 14px; font-weight: 600; }
  .season-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 9px; margin: 5px 0; border-radius: 12px; background: color-mix(in srgb, var(--card) 88%, transparent); font-size: 13px; }
  .season-row a, .catalog-link { color: var(--text); text-decoration: none; }
  .season-row a:hover, .catalog-link:hover { text-decoration: underline; }
  .season-row img { width: 32px; height: 44px; object-fit: cover; border-radius: 5px; }
  .catalog-link { font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <img class="mascot" src="lulu/lulu01.jpg" alt="噜噜和噜妹">
    <div class="title">
      <h1>留子追番</h1>
      <div class="meta"><span id="checked"></span> <span id="syncState"></span></div>
    </div>
    <button class="icon-btn" id="syncBtn" aria-label="同步设置">☁️</button>
    <button class="icon-btn add" id="add">＋ 新增</button>
  </header>

  <dialog id="dlg">
    <form method="dialog" id="addForm">
      <h3><img class="mascot" src="lulu/lulu01.jpg" alt="噜噜和噜妹">新增番剧</h3>
      <input id="addName" placeholder="番名，比如 凡人修仙传" required autocomplete="off">
      <select id="addDay">
        <option value="">周几更新（北京时间，可不选）</option>
        <option value="周一">周一</option><option value="周二">周二</option><option value="周三">周三</option>
        <option value="周四">周四</option><option value="周五">周五</option><option value="周六">周六</option><option value="周日">周日</option>
      </select>
      <p>会跳到 GitHub，点「Submit new issue」提交。大约 1 分钟后自动找好两个网站的链接。删除：标题写「删除 番名」。</p>
      <div class="row"><button value="cancel" formnovalidate>取消</button><button class="primary" value="ok">去提交</button></div>
    </form>
  </dialog>

  <dialog id="syncDlg">
    <form method="dialog" id="syncForm">
      <h3><img class="mascot" src="lulu/lulu01.jpg" alt="噜噜和噜妹">多设备同步</h3>
      <p>看到第几集会存进 GitHub 仓库的 progress.json，每台设备填一次口令就能同步。</p>
      <ol>
        <li>打开 <a id="patLink" target="_blank" rel="noopener">新建 GitHub 口令</a>，Repository access 只选这个仓库，Permissions 里 Contents 选 Read and write，生成后复制。</li>
        <li>粘贴到下面，保存。每台设备都做一次（可以用同一个口令）。</li>
      </ol>
      <input id="token" type="password" placeholder="github_pat_…" autocomplete="off">
      <div class="row">
        <button value="clear" formnovalidate>清除口令</button>
        <button value="cancel" formnovalidate>取消</button>
        <button class="primary" value="ok">保存</button>
      </div>
    </form>
  </dialog>

  <div class="filters">
    <button data-f="all" class="on">国漫最热在更</button>
    <button data-f="new">有新集</button>
    <button data-f="today">今天更新</button>
    <button data-f="off">停更</button>
    <button data-f="us">美剧</button>
    <button data-f="douban">豆瓣Top50</button>
    <button data-f="oscar">奥斯卡最佳影片</button>
    <button data-f="nolan">诺兰专辑</button>
  </div>
  <div id="list"><p class="empty"><img class="mascot" src="lulu/lulu01.jpg" alt="噜噜和噜妹">噜妹加载中…</p></div>
  <footer>
    <div id="tzNote"></div>
    <a id="editLink" target="_blank" rel="noopener">编辑列表</a> · <button id="export">复制进度</button>
  </footer>
</main>
<script>
const KEY = "anime-tracker-watched";
const TOKEN_KEY = "anime-tracker-token";
const DAYS = ["", "周一", "周二", "周三", "周四", "周五", "周六", "周日"];
const SRC = { huaren: "华人直播", ikanbot: "爱看机器人", bilibili: "B站", bangumi: "Bangumi", regex: "来源" };
// 仓库：在 <用户名>.github.io/<仓库名>/ 上自动识别，本地打开时用默认值
const REPO = location.hostname.endsWith(".github.io")
  ? `${location.hostname.split(".")[0]}/${location.pathname.split("/")[1]}`
  : "brucewayne0107/anime-tracker";
const PROGRESS_API = `https://api.github.com/repos/${REPO}/contents/progress.json`;
let data = { shows: [] }, filter = "all";
let catalog = { tabs: [] }, catalogError = false;
let mascots = ["lulu01.jpg"];
const randomMascot = () => `lulu/${mascots[Math.floor(Math.random() * mascots.length)]}`;
function setMascots() { document.querySelectorAll("img.mascot").forEach(img => { img.src = randomMascot(); }); }
fetch("lulu/list.json").then(r => { if (!r.ok) throw new Error("图片清单读取失败"); return r.json(); }).then(files => {
  if (!files.length) return;
  mascots = files;
  setMascots();
}).catch(() => setMascots());

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

// ---------- 时区：shows.json 里的周几/时间是北京时间，换算成看网页这台设备的时区 ----------
const BJ_OFFSET = 8 * 60;
const WEEK = 7 * 1440;
function localSlot(s) {
  if (!(s.day >= 1 && s.day <= 7)) return { day: 0, time: null };
  const [h, m] = (s.time || "12:00").split(":").map(Number); // 没写时间按中午算，只用来定周几
  const bj = (s.day - 1) * 1440 + h * 60 + m;
  const local = (((bj - BJ_OFFSET - new Date().getTimezoneOffset()) % WEEK) + WEEK) % WEEK;
  const pad = n => String(n).padStart(2, "0");
  return { day: Math.floor(local / 1440) + 1,
           time: s.time ? `${pad(Math.floor(local % 1440 / 60))}:${pad(local % 60)}` : null };
}
const today = ((new Date().getDay() + 6) % 7) + 1; // 本地的周几，1=周一 … 7=周日

// ---------- 看到第几集：{番名: {w: 集数, t: 修改时间}}，本地存一份，设了口令就同步到仓库 ----------
function loadLocal() {
  let raw = {};
  try { raw = JSON.parse(store.get(KEY)) || {}; } catch {}
  for (const k in raw) if (typeof raw[k] === "number") raw[k] = { w: raw[k], t: 0 }; // 旧格式
  return raw;
}
let local = loadLocal();
const saveLocal = () => store.set(KEY, JSON.stringify(local));
const watchedOf = s => (local[s.name] ? local[s.name].w : s.watched) || 0;
function setWatched(name, w) {
  local[name] = { w: Math.max(0, w), t: Date.now() };
  saveLocal(); render(); queueSync();
}
function merge(a, b) {
  const out = { ...a };
  for (const k in b) if (!out[k] || (b[k].t || 0) > (out[k].t || 0)) out[k] = b[k];
  return out;
}

const token = () => store.get(TOKEN_KEY);
const b64 = { enc: s => btoa(String.fromCharCode(...new TextEncoder().encode(s))),
              dec: s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0))) };
async function fetchRemote() {
  const headers = { Accept: "application/vnd.github+json" };
  if (token()) headers.Authorization = `Bearer ${token()}`;
  const r = await fetch(PROGRESS_API + `?t=${Date.now()}`, { headers, cache: "no-store" });
  if (r.status === 404) return { sha: null, progress: {} };
  if (!r.ok) throw new Error(`读取失败 ${r.status}`);
  const j = await r.json();
  return { sha: j.sha, progress: JSON.parse(b64.dec(j.content)).shows || {} };
}
async function pushRemote() {
  for (let attempt = 0; attempt < 3; attempt++) {
    const { sha, progress } = await fetchRemote();
    local = merge(progress, local); saveLocal();
    const body = { message: "同步看到第几集", content: b64.enc(JSON.stringify({ shows: local }, null, 2) + "\n") };
    if (sha) body.sha = sha;
    const r = await fetch(PROGRESS_API, { method: "PUT", body: JSON.stringify(body),
      headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${token()}` } });
    if (r.ok) return;
    if (r.status !== 409 && r.status !== 422) throw new Error(`保存失败 ${r.status}`);
  }
  throw new Error("保存冲突");
}
let syncTimer = null;
function setSync(text, ok) {
  const el = document.getElementById("syncState");
  el.textContent = text; el.className = ok ? "sync-ok" : "";
}
function queueSync() {
  if (!token()) return;
  setSync("同步中…");
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => pushRemote().then(() => setSync("☁️ 已同步", true)).catch(e => setSync(`☁️ ${e.message}`)), 1200);
}
async function pullRemote() {
  try {
    const { progress } = await fetchRemote();
    local = merge(local, progress); saveLocal(); render();
    setSync(token() ? "☁️ 已同步" : "", !!token());
  } catch (e) { setSync(token() ? `☁️ ${e.message}` : ""); }
}

// ---------- 渲染 ----------
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ago = iso => {
  if (!iso) return "";
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  return m < 60 ? `${m} 分钟前` : m < 1440 ? `${Math.round(m / 60)} 小时前` : `${Math.round(m / 1440)} 天前`;
};
// 备注里写了「完结」「停播」「停更」的放进「停更」tab
const isOff = s => /完结|停播|停更/.test(s.note || "");
const linkOf = src => src && (src.ok || src.stale) ? (src.url || src.page) : null;

function srcRow(src, label, cls) {
  if (!src) return "";
  const site = SRC[src.type] || src.type;
  const href = linkOf(src);
  if (!href) return `<div class="src"><span class="err" title="${esc(src.error)}"><span class="lbl ${cls}">${label}</span>${site} 检查失败</span></div>`;
  const ep = src.latest != null ? ` · 第${src.latest}集` : "";
  return `<div class="src">
    <a href="${esc(href)}" target="_blank" rel="noopener"><span class="lbl ${cls}">${label}</span>${site}${ep}</a>
    <button class="copy" data-copy="${esc(href)}">复制</button>
  </div>`;
}

function card(s) {
  const w = watchedOf(s), behind = (s.latest ?? 0) - w;
  const main = linkOf(s.primary) || linkOf(s.secondary) || "#";
  const cover = s.cover ? `<img class="cover" src="${esc(s.cover)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove('has-cover');this.remove()">` : "";
  return `<li class="card${behind > 0 ? " new" : ""}${cover ? " has-cover" : ""}">${cover}
    <div class="top">
      <a class="name" href="${esc(main)}" target="_blank" rel="noopener">${esc(s.name)}${s.slot.time ? `<span class="time">${s.slot.time}</span>` : ""}${behind > 0 ? `<span class="badge">嘟! +${behind}</span>` : ""}</a>
      <div class="prog">
        <button data-d="-1" data-n="${esc(s.name)}" aria-label="少看一集">−</button>
        <label class="count"><input type="number" inputmode="numeric" min="0" value="${w}" data-n="${esc(s.name)}" aria-label="看到第几集">/${s.latest ?? "?"}</label>
        <button data-d="1" data-n="${esc(s.name)}" aria-label="多看一集">+</button>
      </div>
    </div>
    ${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}
    <div class="srcs">${srcRow(s.primary, "主", "")}${srcRow(s.secondary, "次", "sub")}</div>
  </li>`;
}

function catalogLinks(entry, label) {
  const sources = entry.sources || {};
  const search = `https://huaren.live/vodsearch/-------------.html?wd=${encodeURIComponent(entry.title + (entry.season ? ` 第${entry.season}季` : ""))}`;
  const main = sources.huaren?.url || (!sources.ikanbot ? search : null);
  const name = main ? `<a class="name" href="${esc(main)}" target="_blank" rel="noopener">${esc(label)}</a>` : `<span class="name">${esc(label)}</span>`;
  return `${name}${sources.ikanbot ? `<a class="catalog-link" href="${esc(sources.ikanbot.url)}" target="_blank" rel="noopener">爱看机器人 ↗</a>` : ""}`;
}
function seasonRow(entry) {
  const sources = entry.sources || {};
  return `<div class="season-row">${entry.cover ? `<img src="${esc(entry.cover)}" alt="" loading="lazy">` : ""}<span>第 ${entry.season} 季</span>${Object.entries(sources).map(([site, source]) => `<a href="${esc(source.url)}" target="_blank" rel="noopener">${SRC[site]} ↗</a>`).join("") || `<a href="https://huaren.live/vodsearch/-------------.html?wd=${encodeURIComponent(entry.title + ` 第${entry.season}季`)}" target="_blank" rel="noopener">搜索华人直播 ↗</a>`}</div>`;
}
function catalogCard(item, tab) {
  const seasons = item.season_items || [];
  const cover = item.cover ? `<img class="cover" src="${esc(item.cover)}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('has-cover');this.remove()">` : "";
  const meta = tab.kind === "tv" ? `${item.start || ""}–${item.end || "至今"} · ${seasons.length} 季` : [tab.key === "douban" ? `#${item.rank}` : "", tab.key === "oscar" ? `第 ${item.ceremony} 届 · ${item.award_year} 年颁奖` : "", `${item.year} 年`].filter(Boolean).join(" · ");
  return `<li class="card${cover ? " has-cover" : ""}">${cover}<div class="top">${catalogLinks(seasons[0] || item, item.title)}</div><div class="catalog-meta">${esc(meta)}</div>${seasons.length > 1 ? `<details><summary>展开各季 · ${seasons.length} 季</summary>${seasons.map(seasonRow).join("")}</details>` : seasons.map(seasonRow).join("")}</li>`;
}
function renderCatalog() {
  const tab = catalog.tabs.find(t => t.key === filter);
  const box = document.getElementById("list");
  if (!tab) { box.innerHTML = `<p class="empty">${catalogError ? "目录暂时无法读取，请稍后重试" : "目录加载中…"}</p>`; return; }
  const items = tab.key === "oscar" ? [...tab.items].sort((a,b) => b.ceremony-a.ceremony) : tab.items;
  box.innerHTML = `<ul class="catalog">${items.map(item => catalogCard(item, tab)).join("")}</ul>`;
}

function render() {
  const isCatalog = ["us", "douban", "oscar", "nolan"].includes(filter);
  document.getElementById("add").hidden = isCatalog;
  document.getElementById("tzNote").hidden = isCatalog;
  if (isCatalog) return renderCatalog();
  let shows = data.shows.map(s => ({ ...s, slot: localSlot(s) })).filter(s => isOff(s) === (filter === "off"));
  if (filter === "new") shows = shows.filter(s => (s.latest ?? 0) > watchedOf(s));
  if (filter === "today") shows = shows.filter(s => s.slot.day === today);
  const groups = {};
  for (const s of shows) (groups[s.slot.day] ||= []).push(s);
  const order = [1, 2, 3, 4, 5, 6, 7, 0].filter(d => groups[d]);
  const box = document.getElementById("list");
  if (!order.length) {
    const msg = { new: "都看完啦，噜妹等新集中～", today: "今天没有更新哦", off: "没有停更的番" }[filter] || "还没有番剧，点右上角新增吧";
    box.innerHTML = `<p class="empty"><img class="mascot" src="${randomMascot()}" alt="噜噜和噜妹">${msg}</p>`;
    return;
  }
  box.innerHTML = order.map(d => `
    <h2 class="${d === today ? "today" : ""}">${d ? DAYS[d] : "未定"}${d === today ? `<span class="tag">今天</span>` : ""}</h2>
    <ul>${groups[d].sort((a, b) => String(a.slot.time ?? "99").localeCompare(String(b.slot.time ?? "99"))).map(card).join("")}</ul>`).join("");
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
    try { document.execCommand("copy"); } catch {}
    t.remove();
  }
  const old = btn.textContent;
  btn.textContent = "已复制"; btn.classList.add("done");
  setTimeout(() => { btn.textContent = old; btn.classList.remove("done"); }, 1500);
}

// ---------- 事件 ----------
const list = document.getElementById("list");
list.addEventListener("click", e => {
  const c = e.target.closest("button[data-copy]");
  if (c) return copy(c.dataset.copy, c);
  const b = e.target.closest("button[data-d]");
  if (!b) return;
  const s = data.shows.find(x => x.name === b.dataset.n);
  setWatched(s.name, watchedOf(s) + Number(b.dataset.d));
});
list.addEventListener("change", e => {
  const i = e.target.closest("input[data-n]");
  if (!i) return;
  const v = parseInt(i.value, 10);
  setWatched(i.dataset.n, Number.isFinite(v) ? v : 0);
});
list.addEventListener("focusin", e => { if (e.target.matches("input[data-n]")) e.target.select(); });
document.querySelector(".filters").addEventListener("click", e => {
  const b = e.target.closest("button[data-f]");
  if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".filters button").forEach(x => x.classList.toggle("on", x === b));
  render();
});
document.getElementById("export").addEventListener("click", e => {
  const out = Object.fromEntries(data.shows.map(s => [s.name, watchedOf(s)]));
  copy(JSON.stringify(out, null, 2), e.target);
});

const open = d => d.showModal ? d.showModal() : d.setAttribute("open", "");
const dlg = document.getElementById("dlg");
document.getElementById("add").addEventListener("click", () => { open(dlg); document.getElementById("addName").focus(); });
document.getElementById("addForm").addEventListener("submit", e => {
  if (e.submitter && e.submitter.value !== "ok") return;
  const name = document.getElementById("addName").value.trim();
  if (!name) return;
  const title = ["新增", name, document.getElementById("addDay").value].filter(Boolean).join(" ");
  location.href = `https://github.com/${REPO}/issues/new?title=${encodeURIComponent(title)}`;
});

const syncDlg = document.getElementById("syncDlg");
document.getElementById("patLink").href = "https://github.com/settings/personal-access-tokens/new?" + new URLSearchParams({
  name: "留子追番同步", description: "anime-tracker progress sync", target_name: REPO.split("/")[0],
  expires_in: "none", contents: "write" });
document.getElementById("syncBtn").addEventListener("click", () => {
  document.getElementById("token").value = token() || "";
  open(syncDlg);
});
document.getElementById("syncForm").addEventListener("submit", e => {
  const v = e.submitter && e.submitter.value;
  if (v === "clear") { store.set(TOKEN_KEY, null); setSync(""); }
  if (v === "ok") {
    const t = document.getElementById("token").value.trim();
    store.set(TOKEN_KEY, t || null);
    if (t) { setSync("同步中…"); pushRemote().then(() => { setSync("☁️ 已同步", true); render(); }).catch(err => setSync(`☁️ ${err.message}`)); }
  }
});

document.getElementById("editLink").href = `https://github.com/${REPO}/edit/main/shows.json`;
const offsetMin = -new Date().getTimezoneOffset();
document.getElementById("tzNote").textContent = offsetMin === BJ_OFFSET
  ? "更新时间为北京时间"
  : `更新时间已换算成你的时区（${Intl.DateTimeFormat().resolvedOptions().timeZone || "本地"}）`;

fetch("data/catalog.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error("目录读取失败"); return r.json(); })
  .then(d => { catalog = d; render(); })
  .catch(() => { catalogError = true; if (["us", "douban", "oscar", "nolan"].includes(filter)) render(); });
fetch("data/status.json", { cache: "no-store" })
  .then(r => r.json())
  .then(d => { data = d; document.getElementById("checked").textContent = `${ago(d.checked_at)}检查`; render(); pullRemote(); })
  .catch(() => { if (["us", "douban", "oscar", "nolan"].includes(filter)) return renderCatalog(); list.innerHTML = `<p class="empty"><img class="mascot" src="${randomMascot()}" alt="噜噜和噜妹">还没有数据，等第一次自动检查跑完</p>`; });
document.addEventListener("visibilitychange", () => { if (!document.hidden && data.shows.length) pullRemote(); });
</script>
</body>
</html>
