<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fb7299">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>追番进度</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2129; --muted: #86909c; --line: #e5e6eb;
    --accent: #fb7299; --accent-soft: #fff0f4; --warn: #ff7d00; --chip: #f2f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17171a; --card: #232326; --text: #e5e6eb; --muted: #8a8f99; --line: #333338;
            --accent-soft: #3a2029; --chip: #2e2e32; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 12px 40px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 20px; margin: 4px 0; }
  .meta { color: var(--muted); font-size: 12px; }
  .filters { position: sticky; top: 0; z-index: 2; background: var(--bg); margin: 8px -12px 4px;
             padding: 8px 12px; display: flex; gap: 8px; overflow-x: auto; }
  .filters button { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
                    padding: 6px 14px; border-radius: 999px; font-size: 14px; }
  .filters button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  h2 { font-size: 14px; color: var(--muted); margin: 16px 4px 8px; font-weight: 600; }
  h2.today { color: var(--accent); }
  h2 .tag { margin-left: 6px; font-size: 12px; padding: 1px 6px; border-radius: 4px; background: var(--accent); color: #fff; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  li.card.new { border-color: var(--accent); background: linear-gradient(90deg, var(--accent-soft), var(--card) 70%); }
  li.card.off { opacity: .6; }
  .top { display: flex; align-items: center; gap: 10px; }
  .name { flex: 1; min-width: 0; font-weight: 600; font-size: 17px; color: inherit; text-decoration: none;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 4px 0; }
  .badge { font-size: 12px; padding: 0 6px; border-radius: 4px; background: var(--accent); color: #fff; margin-left: 4px; vertical-align: 2px; }
  .prog { flex: none; display: flex; align-items: center; gap: 4px; }
  .prog button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line);
                 background: var(--bg); color: var(--text); font-size: 18px; }
  .count { display: flex; align-items: baseline; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
  .count input { width: 52px; font: inherit; font-size: 18px; font-weight: 600; text-align: right; color: var(--text);
                 background: transparent; border: 0; border-bottom: 1px dashed var(--line); padding: 2px 2px; border-radius: 0; }
  .count input:focus { outline: none; border-bottom-color: var(--accent); }
  .count input::-webkit-inner-spin-button, .count input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .time { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .note { font-size: 12px; color: var(--warn); margin-top: 2px; }
  .srcs { display: grid; gap: 6px; margin-top: 8px; }
  .src { display: flex; align-items: center; gap: 6px; }
  .src a, .src .err { flex: 1; min-width: 0; display: block; padding: 7px 10px; border-radius: 10px; background: var(--chip);
                      color: var(--text); text-decoration: none; font-size: 14px;
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src .lbl { color: var(--muted); margin-right: 4px; }
  .src .err { color: var(--warn); }
  .src .copy { flex: none; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
               background: var(--card); color: var(--text); font-size: 13px; }
  .src .copy.done { color: var(--accent); border-color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  footer { margin-top: 24px; color: var(--muted); font-size: 12px; line-height: 1.7; }
  footer button { font-size: 12px; background: none; border: 0; color: var(--accent); padding: 0; }
  .add { border: 0; background: var(--accent); color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 14px; }
  dialog { border: 0; border-radius: 16px; padding: 16px; width: min(92vw, 360px); background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h3 { margin: 0 0 12px; font-size: 17px; }
  dialog input, dialog select { width: 100%; font-size: 16px; padding: 10px; border-radius: 10px;
                                border: 1px solid var(--line); background: var(--bg); color: var(--text); margin-bottom: 10px; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
  dialog .row button { font-size: 15px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  dialog .row button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  dialog p { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>追番进度</h1>
    <span class="meta" id="checked"></span>
    <button class="add" id="add">＋ 新增</button>
  </header>
  <dialog id="dlg">
    <form method="dialog" id="addForm">
      <h3>新增番剧</h3>
      <input id="addName" placeholder="番名，比如 凡人修仙传" required autocomplete="off">
      <select id="addDay">
        <option value="">周几更新（可不选）</option>
        <option value="周一">周一</option><option value="周二">周二</option><option value="周三">周三</option>
        <option value="周四">周四</option><option value="周五">周五</option><option value="周六">周六</option><option value="周日">周日</option>
      </select>
      <p>会跳到 GitHub 页面，点「Submit new issue」提交。后台大约 1 分钟内自动找到两个网站的链接并更新这个页面。删除也一样：标题写「删除 番名」。</p>
      <div class="row"><button value="cancel" formnovalidate>取消</button><button class="primary" value="ok">去提交</button></div>
    </form>
  </dialog>
  <div class="filters">
    <button data-f="all" class="on">追番中</button>
    <button data-f="new">有新集</button>
    <button data-f="today">今天更新</button>
    <button data-f="off">停更</button>
  </div>
  <div id="list"><p class="empty">加载中…</p></div>
  <footer>
    <span id="repoLinks"></span>看到第几集保存在这台设备的浏览器里。换设备前可以
    <button id="export">复制进度</button>，填回 shows.json 的 watched。
  </footer>
</main>
<script>
const KEY = "anime-tracker-watched";
const DAYS = ["", "周一", "周二", "周三", "周四", "周五", "周六", "周日"];
const SRC = { huaren: "华人直播", ikanbot: "爱看机器人", bilibili: "B站", bangumi: "Bangumi", regex: "来源" };
// 仓库：在 <用户名>.github.io/<仓库名>/ 上自动识别，本地打开时用默认值
const REPO = location.hostname.endsWith(".github.io")
  ? `${location.hostname.split(".")[0]}/${location.pathname.split("/")[1]}`
  : "brucewayne0107/anime-tracker";
const today = ((new Date().getDay() + 6) % 7) + 1; // 1=周一 … 7=周日
let data = { shows: [] }, filter = "all";

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }
function save(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} }
let local = load();

const watchedOf = s => (s.name in local ? local[s.name] : s.watched) || 0;
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ago = iso => {
  if (!iso) return "";
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  return m < 60 ? `${m} 分钟前` : m < 1440 ? `${Math.round(m / 60)} 小时前` : `${Math.round(m / 1440)} 天前`;
};
// 备注里写了「完结」「停播」「停更」的放进「停更」tab
const isOff = s => /完结|停播|停更/.test(s.note || "");
const linkOf = src => src && (src.ok || src.stale) ? (src.url || src.page) : null;

function srcRow(src, label) {
  if (!src) return "";
  const site = SRC[src.type] || src.type;
  const href = linkOf(src);
  if (!href) return `<div class="src"><span class="err" title="${esc(src.error)}"><span class="lbl">${label}</span>${site} 检查失败</span></div>`;
  const ep = src.latest != null ? ` · 第${src.latest}集` : "";
  return `<div class="src">
    <a href="${esc(href)}" target="_blank" rel="noopener"><span class="lbl">${label}</span>${site}${ep}</a>
    <button class="copy" data-copy="${esc(href)}">复制</button>
  </div>`;
}

function card(s) {
  const w = watchedOf(s), behind = (s.latest ?? 0) - w;
  const main = linkOf(s.primary) || linkOf(s.secondary) || "#";
  return `<li class="card${behind > 0 ? " new" : ""}">
    <div class="top">
      <a class="name" href="${esc(main)}" target="_blank" rel="noopener">${esc(s.name)}${s.time ? `<span class="time">${esc(s.time)}</span>` : ""}${behind > 0 ? `<span class="badge">+${behind}</span>` : ""}</a>
      <div class="prog">
        <button data-d="-1" data-n="${esc(s.name)}" aria-label="少看一集">−</button>
        <label class="count"><input type="number" inputmode="numeric" min="0" value="${w}" data-n="${esc(s.name)}" aria-label="看到第几集">/${s.latest ?? "?"}</label>
        <button data-d="1" data-n="${esc(s.name)}" aria-label="多看一集">+</button>
      </div>
    </div>
    ${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}
    <div class="srcs">${srcRow(s.primary, "主")}${srcRow(s.secondary, "次")}</div>
  </li>`;
}

function render() {
  let shows = data.shows.filter(s => isOff(s) === (filter === "off"));
  if (filter === "new") shows = shows.filter(s => (s.latest ?? 0) > watchedOf(s));
  if (filter === "today") shows = shows.filter(s => s.day === today);
  const groups = {};
  for (const s of shows) (groups[s.day >= 1 && s.day <= 7 ? s.day : 0] ||= []).push(s);
  const order = [1, 2, 3, 4, 5, 6, 7, 0].filter(d => groups[d]);
  const box = document.getElementById("list");
  if (!order.length) { box.innerHTML = `<p class="empty">没有番剧</p>`; return; }
  box.innerHTML = order.map(d => `
    <h2 class="${d === today ? "today" : ""}">${d ? DAYS[d] : "未定"}${d === today ? `<span class="tag">今天</span>` : ""}</h2>
    <ul>${groups[d].sort((a, b) => String(a.time ?? "99").localeCompare(String(b.time ?? "99"))).map(card).join("")}</ul>`).join("");
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
    try { document.execCommand("copy"); } catch {}
    t.remove();
  }
  const old = btn.textContent;
  btn.textContent = "已复制"; btn.classList.add("done");
  setTimeout(() => { btn.textContent = old; btn.classList.remove("done"); }, 1500);
}

document.getElementById("list").addEventListener("click", e => {
  const c = e.target.closest("button[data-copy]");
  if (c) return copy(c.dataset.copy, c);
  const b = e.target.closest("button[data-d]");
  if (!b) return;
  const s = data.shows.find(x => x.name === b.dataset.n);
  local[s.name] = Math.max(0, watchedOf(s) + Number(b.dataset.d));
  save(local); render();
});
document.getElementById("list").addEventListener("change", e => {
  const i = e.target.closest("input[data-n]");
  if (!i) return;
  const v = parseInt(i.value, 10);
  local[i.dataset.n] = Number.isFinite(v) && v >= 0 ? v : 0;
  save(local); render();
});
document.getElementById("list").addEventListener("focusin", e => {
  if (e.target.matches("input[data-n]")) e.target.select();
});
document.querySelector(".filters").addEventListener("click", e => {
  const b = e.target.closest("button[data-f]");
  if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".filters button").forEach(x => x.classList.toggle("on", x === b));
  render();
});
document.getElementById("export").addEventListener("click", e => {
  const out = Object.fromEntries(data.shows.map(s => [s.name, watchedOf(s)]));
  copy(JSON.stringify(out, null, 2), e.target);
});

const dlg = document.getElementById("dlg");
document.getElementById("add").addEventListener("click", () => {
  dlg.showModal ? dlg.showModal() : dlg.setAttribute("open", "");
  document.getElementById("addName").focus();
});
document.getElementById("addForm").addEventListener("submit", e => {
  if (e.submitter && e.submitter.value !== "ok") return;
  const name = document.getElementById("addName").value.trim();
  if (!name) return;
  const title = ["新增", name, document.getElementById("addDay").value].filter(Boolean).join(" ");
  location.href = `https://github.com/${REPO}/issues/new?title=${encodeURIComponent(title)}`;
});
document.getElementById("repoLinks").innerHTML =
  `<a href="https://github.com/${REPO}/edit/main/shows.json" style="color:inherit">编辑列表</a> · `;

fetch("data/status.json", { cache: "no-store" })
  .then(r => r.json())
  .then(d => { data = d; document.getElementById("checked").textContent = `${ago(d.checked_at)}检查`; render(); })
  .catch(() => { document.getElementById("list").innerHTML = `<p class="empty">还没有数据，等第一次自动检查跑完</p>`; });
</script>
</body>
</html>
