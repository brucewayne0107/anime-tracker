name: 检查番剧更新

on:
  schedule:
    - cron: "17 */3 * * *"   # 每 3 小时一次（UTC）
  workflow_dispatch:          # 可在 Actions 页面手动运行
  push:
    branches: [main]
    paths: [shows.json, scripts/**, docs/**]
  issues:
    types: [opened]           # 网页上点「新增」会开一个 issue，这里接住它

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    # issue 只认仓库主人开的，别人开的不处理
    if: github.event_name != 'issues' || github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 按 issue 新增 / 删除番剧
        id: edit
        if: github.event_name == 'issues'
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          if python scripts/add.py --issue "$TITLE" > result.txt 2>&1; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
          cat result.txt

      - run: python scripts/check.py

      - name: 有变化就提交
        env:
          MSG: ${{ github.event_name == 'issues' && format('番剧列表：{0}', github.event.issue.title) || '更新番剧状态' }}
        run: |
          # 只有 checked_at 变了不提交，免得每 3 小时一条提交
          f=docs/data/status.json
          if git ls-files --error-unmatch "$f" >/dev/null 2>&1 && git diff --quiet -I '"checked_at"' -- "$f" shows.json; then
            echo "没有新集"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f" shows.json
          git commit -m "$MSG"
          # 网页同步进度会往 main 写 progress.json，先拉一下再推
          git pull --rebase origin main
          git push

      - name: 回复并关闭 issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          OK: ${{ steps.edit.outputs.ok }}
        run: |
          gh issue comment "$NUM" --body-file result.txt
          if [ "$OK" = "1" ]; then gh issue close "$NUM"; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
