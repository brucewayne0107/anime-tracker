name: 检查番剧更新

on:
  schedule:
    - cron: "17 */3 * * *"   # 每 3 小时一次（UTC）
  workflow_dispatch:          # 可在 Actions 页面手动运行
  push:
    branches: [main]
    paths: [shows.json, scripts/**]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check.py
      - name: 有变化就提交
        run: |
          # 只有 checked_at 变了不提交，免得每 3 小时一条提交
          f=docs/data/status.json
          if git ls-files --error-unmatch "$f" >/dev/null 2>&1 && git diff --quiet -I '"checked_at"' -- "$f"; then
            echo "没有新集"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/status.json
          git commit -m "更新番剧状态"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
