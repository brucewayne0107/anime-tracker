name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          curl -s -A "$UA" https://huaren.live/voddetail/109.html > h.html
          grep -o '<meta[^>]*image[^>]*>' h.html | head
          grep -oE '(data-src|data-original|src)="[^"]*\.(jpg|jpeg|png|webp)[^"]*"' h.html | head -20
          grep -oE 'background[^;"]*url\([^)]*\)' h.html | head
          echo ---IKAN
          curl -s -A "$UA" https://www.ikanbot.com/play/622370 > i.html
          grep -oE '<img[^>]*>' i.html | head -10
          grep -o '<meta[^>]*image[^>]*>' i.html | head
          echo ---FETCH
          U=$(grep -oE '(data-src|data-original)="[^"]*"' h.html | head -1 | cut -d'"' -f2); echo "$U"
          case "$U" in http*) ;; //*) U="https:$U";; *) U="https://huaren.live$U";; esac
          curl -s -A "$UA" -o p.img -w '%{http_code} %{content_type} %{size_download}\n' "$U"
          curl -s -A "$UA" -e https://huaren.live/ -o p2.img -w 'ref %{http_code} %{content_type} %{size_download}\n' "$U"
