name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: feat/tracker }
      - run: |
          python - <<'PY'
          import sys,re,json; sys.path.insert(0,'scripts'); import check
          pid='951698'
          html=check.fetch_text(f'https://www.ikanbot.com/play/{pid}')
          e=re.search(r'id="e_token" value="([^"]*)"',html).group(1); m=re.search(r'id="mtype" value="([^"]*)"',html).group(1)
          d=check.fetch_json(f'https://www.ikanbot.com/api/getResN?videoId={pid}&mtype={m}&token={check.ikanbot_token(pid,e)}')
          print(json.dumps(d,ensure_ascii=False)[:2500])
          PY
