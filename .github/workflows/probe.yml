name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          curl -sSL -m 30 -A "$UA" -o js "https://www.ikanbot.com/resources/play_new.js?v=1.64"
          sed -n '118,170p' js
          for t in 仙逆 牧神记 一斩苍穹 灵境行者 沧元图 光阴之外 择日飞升 星辰变 咒术回战 海贼王 斗破苍穹; do
            echo "##### $t"
            curl -sSL -m 30 -A "$UA" -G --data-urlencode "wd=$t" -o h.html -w "huaren %{http_code}\n" "https://huaren.live/vodsearch/-------------.html"
            grep -oE 'href="/voddetail/[0-9]+\.html"[^>]*title="[^"]*"' h.html | sort -u | head -8
            grep -oE 'class="[^"]*remarks?[^"]*"[^>]*>[^<]{0,40}' h.html | head -8
            curl -sSL -m 30 -A "$UA" -G --data-urlencode "q=$t" -o k.html -w "ikanbot %{http_code}\n" "https://www.ikanbot.com/search"
            grep -oE 'href="/play/[0-9]+"[^>]*>' k.html | sort -u | head -6
            grep -oE '<h5[^>]*>.{0,120}' k.html | head -6
          done
