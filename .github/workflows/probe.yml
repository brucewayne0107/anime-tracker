name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          for u in https://huaren.live/voddetail/122.html "https://huaren.live/api.php/provide/vod/?ac=detail&ids=122" https://www.ikanbot.com/play/978607 "https://www.ikanbot.com/search?q=凡人修仙传"; do
            echo "=== $u"; curl -sSL -m 30 -A "$UA" -o p.html -w "%{http_code} %{size_download}\n" "$u"; head -c 400 p.html; echo
            grep -oE '(vodplay/[0-9-]+\.html"[^<]{0,80}<?)' p.html | tail -5
            grep -oE '<input[^>]*>' p.html | head -20
            grep -oE '<script[^>]*src="[^"]*"' p.html | head -20
            grep -oE 'href="/play/[0-9]+"[^<]{0,120}' p.html | head -10
          done
      - run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
          cat > r.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(); pg = await b.new_page()
                  async def on_resp(r):
                      if r.request.resource_type in ("xhr","fetch"):
                          try: body = (await r.text())[:1500]
                          except Exception as e: body = str(e)
                          print("XHR", r.status, r.url, "\n", body, "\n")
                  pg.on("response", on_resp)
                  await pg.goto("https://www.ikanbot.com/play/978607", wait_until="networkidle")
                  await pg.wait_for_timeout(3000)
                  html = await pg.content()
                  import re
                  i = html.find("集")
                  print("LEN", len(html)); print(html[max(0,i-1500):i+1500])
                  await b.close()
          asyncio.run(main())
          PY
          python r.py
      - run: curl -sSL -m 30 https://www.ikanbot.com/play/978607 | grep -oE 'src="[^"]*\.js[^"]*"' | head; for j in $(curl -sSL -m 30 https://www.ikanbot.com/play/978607 | grep -oE 'src="/[^"]*\.js[^"]*"' | sed 's/src="//;s/"$//'); do echo "=== $j"; curl -sSL -m 30 "https://www.ikanbot.com$j" | grep -oE '.{300}getRes.{600}' | head -3; done
