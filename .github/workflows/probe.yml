name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: feat/tracker }
      - run: python scripts/check.py && cat docs/data/status.json | python -c "import json,sys;[print(s['name'],s['latest'],json.dumps(s['primary'],ensure_ascii=False),json.dumps(s['secondary'],ensure_ascii=False)) for s in json.load(sys.stdin)['shows']]"
