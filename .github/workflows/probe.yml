name: probe
on: push
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch -q origin feat/dumei && git checkout -q origin/feat/dumei -- scripts shows.json docs
          python scripts/check.py | tail -12
          ls -la docs/covers
          grep '"cover"' docs/data/status.json
          mkdir -p out && cp -r docs/covers docs/data/status.json out/
          git rm -rq --cached scripts shows.json docs || true
          git add out && git -c user.name=p -c user.email=p@x commit -qm "probe covers out" && git push -q origin HEAD:probe2
