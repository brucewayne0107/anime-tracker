name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          curl -sSL -m 30 -A "$UA" -o js "https://www.ikanbot.com/resources/play_new.js?v=1.64" -w "%{http_code} %{size_download}\n"
          tr ';' '\n' < js | grep -nE 'token|getRes|ajax|url|api|e_token|current_id|mtype' | head -80
          echo ===== HEAD; head -c 3000 js
